spring:
  application:
    name: Customer-Service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://customer-db:3306/${MYSQL_CUSTOMER_DATABASE:db-customer}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_CUSTOMER_USER:DB_Admin}
    password: ${MYSQL_CUSTOMER_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:customer-service-consumer-group}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: Customer-Service
        instance-id: Customer-Service:${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 8082
