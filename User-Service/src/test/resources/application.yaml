spring:
  datasource:
    url: jdbc:h2:mem:user-service-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  cloud:
    consul:
      enabled: false
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false
